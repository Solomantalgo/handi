<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0"><iframe id="menu" src="/" style="display:block;width:100vw;height:100vh;border:0"></iframe><pre id="results" style="display:none"></pre><script>
const frame=document.querySelector('#menu');const screen=new URLSearchParams(location.search).get('screen');const delay=ms=>new Promise(r=>setTimeout(r,ms));frame.onload=async()=>{const w=frame.contentWindow,d=w.document;const checks={};try{await delay(500);const click=q=>{const e=d.querySelector(q);if(!e)throw Error('Missing '+q);e.click();return e};if(screen==='drinks'){click('[data-mode="drinks"]');await delay(150);checks.heading=d.querySelector('#introHeading').innerText;checks.banner=d.querySelector('#introBanner').getAttribute('src')}else if(screen==='category-sheet'){click('#categoryTrigger');await delay(100);checks.categoryDialogOpen=d.querySelector('#categoryDialog').getAttribute('aria-hidden')==='false';checks.searchFocused=d.activeElement===d.querySelector('#categorySearch')}else if(screen==='chicken'){click('[data-category="chicken-mains"]');d.querySelector('#searchInput').value='Butter Chicken';d.querySelector('#searchInput').dispatchEvent(new Event('input',{bubbles:true}));await delay(300);checks.selectedHeader=!d.querySelector('#selectedCategoryHeader').hidden;checks.photoSrc=d.querySelector('.menu-card img')?.getAttribute('src')||'';checks.itemName=d.querySelector('.menu-card h3')?.innerText||''}else{click('[data-mode="drinks"]');checks.drinksBanner=d.querySelector('#introBanner').getAttribute('src');click('[data-mode="food"]');checks.foodBanner=d.querySelector('#introBanner').getAttribute('src');const cat=click('#categoryTrigger');checks.categoryTriggerFocus=!!cat;click('[data-category="chicken-mains"]');checks.selectedCategory=d.querySelector('#categoryLabel').innerText;checks.headerVisible=!d.querySelector('#selectedCategoryHeader').hidden;d.querySelector('#searchInput').value='Butter Chicken';d.querySelector('#searchInput').dispatchEvent(new Event('input',{bubbles:true}));await delay(150);checks.filteredCardCount=d.querySelectorAll('.menu-card').length;checks.photoSrc=d.querySelector('.menu-card img')?.getAttribute('src')||'';checks.viewportWidth=w.innerWidth;checks.documentWidth=d.documentElement.scrollWidth;const add=d.querySelector('[data-add]');add.click();checks.detailOpened=d.querySelector('#detailSheet').getAttribute('aria-hidden')==='false';d.querySelector('#detailAdd').click();checks.cartCount=d.querySelector('#cartCount').innerText;click('#openCart');checks.orderOpened=d.querySelector('#orderSheet').getAttribute('aria-hidden')==='false';checks.serviceTabs=d.querySelectorAll('[data-service]').length;const assets=w.eval('ITEM_IMAGE_MANIFEST');checks.totalItems=assets.length;checks.itemsWithPhotos=assets.filter(x=>x.image).length;checks.unresolved=assets.filter(x=>!x.image).length;checks.individualCategoryReuse=assets.some(x=>x.image&&Object.values(w.FOOD_CATEGORY_IMAGES).includes(x.image));}document.querySelector('#results').textContent=JSON.stringify(checks)}catch(e){document.querySelector('#results').textContent=JSON.stringify({error:String(e),checks})}};
</script></body></html>
